name: Ponte DM (commenti con la parola chiave)

# Legge i commenti dei post e dei Reel recenti e manda al titolare su Telegram il DM da incollare a chi ha commentato
# la parola chiave. Serve il permesso instagram_business_manage_comments (va dato all'app Meta).
# Prova del 20/10/2026: la chiave attuale legge già i commenti. Ogni 2 ore (UTC 6-20 → ~08-22 a Roma con l'ora legale):
# poche partenze per non consumare i minuti gratuiti del repository privato.
on:
  schedule:
    - cron: "20 6-20/2 * * *"
  workflow_dispatch:
    inputs:
      modalita:
        description: "prova = manda anche l'esito su Telegram"
        type: choice
        options: [prova, normale]
        default: prova

concurrency:
  group: commenti
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  commenti:
    runs-on: ubuntu-latest
    if: ${{ vars.ATTIVO == 'si' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Leggi i commenti
        run: python -m pubblicatore.commenti
        env:
          MODALITA: ${{ inputs.modalita }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Agente Guida (DM, appuntamenti e richieste commerciali)
        # Separato: se non va, il ponte DM non ne risente. Bozze su Telegram finché GUIDA_INVIO non è "automatico".
        if: always()
        continue-on-error: true
        run: python -m pubblicatore.guida
        env:
          MODALITA: ${{ inputs.modalita }}
          GUIDA_INVIO: ${{ vars.GUIDA_INVIO }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REFERENTE: ${{ secrets.REFERENTE }}
          EMAIL_CONTATTO: ${{ secrets.EMAIL_CONTATTO }}
          EMAIL_MITTENTE: ${{ secrets.EMAIL_MITTENTE }}
          EMAIL_PASSWORD_APP: ${{ secrets.EMAIL_PASSWORD_APP }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
      - name: Esempi di Reel mandati su Telegram (/esempio)
        if: always()
        continue-on-error: true
        run: python -m pubblicatore.ispirazione
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
