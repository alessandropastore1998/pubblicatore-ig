name: Pubblica il Reel

# Separato da "Pubblica il post del giorno": se il Reel fallisce, il carosello esce comunque.
on:
  schedule:
    # Orari in UTC; lo script guarda l'ora di Roma (legale o solare) e capisce la fascia.
    # Prima partenza utile ~07:15 / ~19:15 Roma: monta il Reel, manda l'anteprima su Telegram,
    # aspetta il carosello e pubblica il Reel verso le 07:40 / 19:40. Le altre partenze sono riserve.
    - cron: "15 5,6,7,17,18,19 * * *"
  workflow_dispatch:
    inputs:
      modalita:
        description: "prova = monta e prova senza pubblicare · pubblica-adesso = pubblica subito"
        type: choice
        options: [prova, pubblica-adesso]
        default: prova
      data:
        description: "Data del post (AAAA-MM-GG). Vuoto = oggi"
        required: false
        default: ""
      fascia:
        description: "Quale post di quella data"
        type: choice
        options: [auto, mattina, sera]
        default: auto
      cartella:
        description: "post = post veri · test = post di prova (solo con modalita prova)"
        type: choice
        options: [post, test]
        default: post
      rimonta:
        description: "Rimonta il video anche se ne esiste già uno con lo stesso contenuto"
        type: boolean
        default: false
      montaggio:
        description: "Montaggio da provare (variabile = quello della variabile MONTAGGIO_REEL)"
        type: choice
        options: [variabile, v1, v2]
        default: variabile

concurrency:
  group: reel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reel:
    runs-on: ubuntu-latest
    if: ${{ vars.ATTIVO == 'si' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-reel.txt
      - run: pip install -r requirements-reel.txt
      - name: Reel
        run: python -m pubblicatore.reel
        env:
          MODALITA: ${{ inputs.modalita }}
          DATA_POST: ${{ inputs.data }}
          FASCIA: ${{ inputs.fascia }}
          CARTELLA: ${{ inputs.cartella }}
          RIMONTA: ${{ inputs.rimonta }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROFILO: ${{ secrets.PROFILO }}
          PAUSA: ${{ vars.PAUSA }}
          PAUSA_REEL: ${{ vars.PAUSA_REEL }}
          STORIA_REEL: ${{ vars.STORIA_REEL }}
          # v1 (predefinito) o v2: per tornare indietro basta rimettere la variabile a v1
          MONTAGGIO_REEL: ${{ (inputs.montaggio && inputs.montaggio != 'variabile') && inputs.montaggio || vars.MONTAGGIO_REEL }}
