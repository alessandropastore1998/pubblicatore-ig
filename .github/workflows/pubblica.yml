name: Pubblica il post del giorno

on:
  schedule:
    # Orari in UTC; lo script guarda l'ora di Roma e capisce la fascia (mattina 07:30, sera 19:30).
    # - ora legale (UTC+2): 05:08/17:08 → 07:08/19:08 Roma (principali), le altre sono riserve
    # - ora solare (UTC+1): 05:08/17:08 → 06:08/18:08 Roma (si fermano), 06:08/18:08 → principali, 07:08/19:08 → riserve
    # Si parte ~20 minuti prima perché GitHub spesso avvia in ritardo; lo script aspetta l'orario da solo.
    - cron: "8 5,6,7,17,18,19 * * *"
  workflow_dispatch:
    inputs:
      modalita:
        description: "prova = controlla tutto senza pubblicare · pubblica-adesso = pubblica subito"
        type: choice
        options: [prova, pubblica-adesso]
        default: prova
      data:
        description: "Data del post (AAAA-MM-GG). Vuoto = oggi"
        required: false
        default: ""
      fascia:
        description: "Quale post di quella data (auto = il primo non ancora pubblicato)"
        type: choice
        options: [auto, mattina, sera]
        default: auto
      cartella:
        description: "post = post veri · test = post di prova (solo con modalita prova)"
        type: choice
        options: [post, test]
        default: post

# Mai due pubblicazioni in parallelo: la seconda aspetta la prima e poi vede pubblicato.json.
concurrency:
  group: pubblica
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pubblica:
    runs-on: ubuntu-latest
    if: ${{ vars.ATTIVO == 'si' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pubblica
        run: python -m pubblicatore.main
        env:
          MODALITA: ${{ inputs.modalita }}
          DATA_POST: ${{ inputs.data }}
          FASCIA: ${{ inputs.fascia }}
          CARTELLA: ${{ inputs.cartella }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROFILO: ${{ secrets.PROFILO }}
          PAUSA: ${{ vars.PAUSA }}
          RICHIEDI_APPROVAZIONE: ${{ vars.RICHIEDI_APPROVAZIONE }}
          PUBBLICA_STORIA: ${{ vars.PUBBLICA_STORIA }}
