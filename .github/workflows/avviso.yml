name: Messaggio Telegram al titolare

# Solo avvio manuale. Il testo sta in un file di Dropbox (/avvisi/<nome>.md nella cartella dell'app),
# così nel repository pubblico non compare: qui si scrive solo il nome del file.
on:
  workflow_dispatch:
    inputs:
      file:
        description: "Nome del file in /avvisi/ (es. 2026-10-21-riassunto.md)"
        required: true

permissions:
  contents: read

jobs:
  avviso:
    runs-on: ubuntu-latest
    if: ${{ vars.ATTIVO == 'si' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Invia
        run: python -m pubblicatore.messaggio
        env:
          FILE_MESSAGGIO: ${{ inputs.file }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
